[project]
name = "cohere-transcribe-cli"
version = "0.1.0"
description = "Local CLI for Cohere Transcribe (open-source 2B Conformer ASR)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
authors = [{ name = "James Ding", email = "pypi@twango.dev" }]
keywords = ["cohere", "transcribe", "asr", "speech-recognition", "cli", "audio", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.13.0",
    "av>=17.0.1",
    "huggingface-hub>=1.13.0",
    "librosa>=0.11.0",
    "numpy>=2.4.4",
    "protobuf>=7.34.1",
    "rich>=15.0.0",
    "sentencepiece>=0.2.1",
    "soundfile>=0.13.1",
    "torch>=2.11.0",
    "transformers>=5.4",
    "typer>=0.25.1",
]

[project.urls]
Homepage = "https://github.com/twangodev/cohere-transcribe-cli"
Issues = "https://github.com/twangodev/cohere-transcribe-cli/issues"
Model = "https://huggingface.co/CohereLabs/cohere-transcribe-03-2026"

[project.scripts]
cohere = "cohere_transcribe_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cohere_transcribe_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
