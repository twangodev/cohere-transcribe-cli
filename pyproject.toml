[project]
name = "cohere-transcribe-cli"
version = "0.1.0"
description = "Local CLI for Cohere Transcribe (Hugging Face Conformer ASR)."
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "av>=17.0.1",
    "huggingface-hub>=1.13.0",
    "librosa>=0.11.0",
    "numpy>=2.4.4",
    "protobuf>=7.34.1",
    "rich>=15.0.0",
    "sentencepiece>=0.2.1",
    "soundfile>=0.13.1",
    "torch>=2.11.0",
    "transformers>=5.4",
    "typer>=0.25.1",
]

[project.scripts]
cohere = "cohere_transcribe_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cohere_transcribe_cli"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
